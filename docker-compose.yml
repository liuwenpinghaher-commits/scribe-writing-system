# scribe3 · docker-compose 一键起服(本地开发)
# 用法: docker compose up
# SurrealDB + 后端(:3321) + 前端(:3311)
# Hermes 网关用宿主已跑的 :8642/:8643(llm.py 经 env 指向宿主)

services:
  surreal:
    image: surrealdb/surrealdb:latest
    command: start --user ${SURREAL_USER:-root} --pass ${SURREAL_PASS:-root} --bind 0.0.0.0:8001 rocksdb:/data
    ports: ["8001:8001"]
    volumes: ["surreal-data:/data"]
    healthcheck:
      test: ["CMD", "sh", "-c", "surreal sql --endpoint ws://127.0.0.1:8001 -u root -p root --ns scribe3 --db _reg -q 'SELECT 1'"]

  backend:
    build:
      context: .
      dockerfile: scribe3/Dockerfile.backend
    environment:
      SCRIBE3_SURREAL_URL: ws://surreal:8001/rpc
      SCRIBE3_SURREAL_USER: ${SURREAL_USER:-root}
      SCRIBE3_SURREAL_PASS: ${SURREAL_PASS:-root}
      HERMES_API: http://host.docker.internal:8642/v1
      HERMES_RESPONSES_API: http://host.docker.internal:8643/v1
      SCRIBE3_CORS_ORIGINS: http://127.0.0.1:3311
    command: uvicorn scribe3.app:app --host 0.0.0.0 --port 3321
    ports: ["3321:3321"]
    depends_on:
      surreal:
        condition: service_started

  frontend:
    build:
      context: scribe3/web
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://127.0.0.1:3321}
    ports: ["3311:80"]
    depends_on:
      - backend

volumes:
  surreal-data:
