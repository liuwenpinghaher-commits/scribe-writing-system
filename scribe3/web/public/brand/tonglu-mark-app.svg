<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="tonglu">
  <rect width="128" height="128" rx="28" fill="#0B1220"/>

  <!--
    铜炉 mark · 赛博朋克 / 未来科幻 · 透明底矢量
    概念：HUD 六边形 × 反应堆核心 × 等离子笔锋 × 悬浮推进基座
    主色：电青 / 品红霓虹 · 辅：冷金属 + 铜线高光
  -->
  <defs>
    <linearGradient id="neon" x1="64" y1="8" x2="64" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DF9FF"/>
      <stop offset=".45" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#0090B8"/>
    </linearGradient>
    <linearGradient id="mag" x1="40" y1="20" x2="96" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7AD9"/>
      <stop offset=".5" stop-color="#FF2D95"/>
      <stop offset="1" stop-color="#B5179E"/>
    </linearGradient>
    <linearGradient id="core" x1="48" y1="48" x2="88" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8FFF8"/>
      <stop offset=".35" stop-color="#5CF2D0"/>
      <stop offset=".7" stop-color="#00C2D4"/>
      <stop offset="1" stop-color="#FF2D95"/>
    </linearGradient>
    <linearGradient id="metal" x1="36" y1="72" x2="92" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B8C5D6"/>
      <stop offset=".4" stop-color="#5A6A80"/>
      <stop offset="1" stop-color="#1E2A3A"/>
    </linearGradient>
    <linearGradient id="copper" x1="30" y1="70" x2="98" y2="98" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD19A"/>
      <stop offset=".5" stop-color="#E07A3A"/>
      <stop offset="1" stop-color="#9C4A22"/>
    </linearGradient>
    <linearGradient id="thrust" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#7DF9FF" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#00E5FF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="thrust-m" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FF7AD9" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#FF2D95" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FF2D95" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="64" cy="62" r="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E5FF" stop-opacity=".35"/>
      <stop offset=".55" stop-color="#FF2D95" stop-opacity=".12"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pad-glow" cx="64" cy="104" r="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E5FF" stop-opacity=".4"/>
      <stop offset=".65" stop-color="#FF2D95" stop-opacity=".12"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 软光晕 -->
  <circle cx="64" cy="64" r="48" fill="url(#glow)"/>

  <!-- 外层 HUD 六边形 -->
  <path
    d="M64 10 L108 35.5 V92.5 L64 118 L20 92.5 V35.5 Z"
    stroke="url(#neon)"
    stroke-width="2.4"
    stroke-linejoin="round"
    opacity=".95"/>
  <!-- 内层细六边形 -->
  <path
    d="M64 20 L98 40 V88 L64 108 L30 88 V40 Z"
    stroke="url(#mag)"
    stroke-width="1.2"
    stroke-linejoin="round"
    opacity=".75"/>

  <!-- 四角科技卡榫 -->
  <g stroke="url(#neon)" stroke-width="2" stroke-linecap="square" opacity=".9">
    <path d="M38 28 H30 V36"/>
    <path d="M90 28 H98 V36"/>
    <path d="M38 100 H30 V92"/>
    <path d="M90 100 H98 V92"/>
  </g>
  <!-- 对角品红锚点 -->
  <g fill="#FF2D95">
    <circle cx="64" cy="10" r="2.2"/>
    <circle cx="64" cy="118" r="2.2"/>
    <circle cx="20" cy="64" r="1.8" opacity=".85"/>
    <circle cx="108" cy="64" r="1.8" opacity=".85"/>
  </g>

  <!-- 刻度 -->
  <g stroke="#7DF9FF" stroke-width="1.4" stroke-linecap="round" opacity=".55">
    <path d="M64 24 v4.5"/>
    <path d="M34.5 48 l3.8 2.2"/>
    <path d="M89.7 77.8 l3.8 2.2"/>
    <path d="M34.5 80 l3.8-2.2"/>
    <path d="M89.7 50.2 l3.8-2.2"/>
  </g>

  <!-- ========== 悬浮推进基座（科幻） ========== -->
  <!-- 地面能量场 -->
  <ellipse cx="64" cy="112" rx="26" ry="5.5" fill="url(#pad-glow)"/>
  <ellipse cx="64" cy="112" rx="18" ry="2.8" stroke="#7DF9FF" stroke-width="1" opacity=".55" fill="none"/>
  <ellipse cx="64" cy="112" rx="10" ry="1.4" stroke="#FF2D95" stroke-width=".8" opacity=".45" fill="none"/>

  <!-- 反重力推力锥（三处，先画在平台下） -->
  <g opacity=".9">
    <path fill="url(#thrust)" d="M40 98 L44 98 L42 112 Z"/>
    <path fill="url(#thrust-m)" d="M62 100 L66 100 L64 114 Z"/>
    <path fill="url(#thrust)" d="M84 98 L88 98 L86 112 Z"/>
  </g>

  <!-- 三角推进吊舱（机械结构，非兽足） -->
  <g fill="url(#metal)">
    <!-- 左 -->
    <path d="M36 90 L48 90 L46 98 L38 98 Z"/>
    <path d="M38 98 L46 98 L44 102 L40 102 Z" fill="#1E2A3A"/>
    <!-- 中 -->
    <path d="M58 92 L70 92 L68 100 L60 100 Z"/>
    <path d="M60 100 L68 100 L66 104 L62 104 Z" fill="#1E2A3A"/>
    <!-- 右 -->
    <path d="M80 90 L92 90 L90 98 L82 98 Z"/>
    <path d="M82 98 L90 98 L88 102 L84 102 Z" fill="#1E2A3A"/>
  </g>
  <!-- 吊舱霓虹缝 -->
  <g stroke="#00E5FF" stroke-width="1" stroke-linecap="round" opacity=".9">
    <path d="M39 93 h6"/>
    <path d="M61 95 h6"/>
    <path d="M83 93 h6"/>
  </g>
  <g fill="#FF2D95">
    <circle cx="42" cy="96.5" r="1.2"/>
    <circle cx="64" cy="98.5" r="1.2"/>
    <circle cx="86" cy="96.5" r="1.2"/>
  </g>

  <!-- 力场支撑弧（连接核心与平台） -->
  <g stroke="url(#neon)" stroke-width="1.3" stroke-linecap="round" opacity=".55" stroke-dasharray="2 2.5">
    <path d="M50 78 Q42 86 42 94"/>
    <path d="M78 78 Q86 86 86 94"/>
    <path d="M64 80 V92"/>
  </g>

  <!-- 六边形悬浮甲板 -->
  <path
    fill="url(#metal)"
    stroke="url(#neon)"
    stroke-width="1.6"
    d="M46 82 L64 74 L82 82 L78 92 L50 92 Z"
    opacity=".95"/>
  <!-- 甲板中心能量环 -->
  <ellipse cx="64" cy="85" rx="10" ry="3.6" fill="none" stroke="url(#mag)" stroke-width="1.2" opacity=".85"/>
  <ellipse cx="64" cy="85" rx="5" ry="1.8" fill="#00E5FF" opacity=".35"/>
  <!-- 甲板刻线 -->
  <g stroke="#7DF9FF" stroke-width=".9" opacity=".55" stroke-linecap="round">
    <path d="M52 86 h6"/>
    <path d="M70 86 h6"/>
    <path d="M64 78.5 v3"/>
  </g>
  <!-- 甲板铜触点（铜炉隐喻，极克制） -->
  <g fill="url(#copper)">
    <rect x="49" y="88.5" width="4" height="2" rx="0.5"/>
    <rect x="75" y="88.5" width="4" height="2" rx="0.5"/>
  </g>

  <!-- 核心对接环（collar，替代旧炉口） -->
  <path
    fill="url(#metal)"
    stroke="url(#neon)"
    stroke-width="1.4"
    d="M48 74c0-1.6 1.2-2.8 2.8-3h26.4c1.6 0 2.8 1.2 2.8 3 0 2.4-2.8 4.5-7 5.2-.8.1-1.6.2-5 .2s-4.2-.1-5-.2c-4.2-.7-7-2.8-7-5.2z"
    opacity=".95"/>
  <path stroke="#FF2D95" stroke-width="1" d="M52 74h24" opacity=".7"/>
  <g fill="#00E5FF">
    <circle cx="54" cy="74" r="1.3"/>
    <circle cx="64" cy="74" r="1.3"/>
    <circle cx="74" cy="74" r="1.3"/>
  </g>

  <!-- ========== 核心反应环 ========== -->
  <circle cx="64" cy="58" r="18" stroke="url(#neon)" stroke-width="2.6" opacity=".95"/>
  <circle cx="64" cy="58" r="13.5" stroke="url(#mag)" stroke-width="1.3" stroke-dasharray="3.5 2.8" opacity=".85"/>
  <circle cx="64" cy="58" r="8.5" fill="url(#core)" filter="url(#soft)"/>
  <circle cx="64" cy="58" r="3.6" fill="#FFFFFF" opacity=".9"/>

  <!-- 等离子笔锋 -->
  <path
    filter="url(#soft)"
    fill="url(#neon)"
    d="M64 14c4.8 8.6 8.2 15.8 8.2 22.6 0 6.2-3.4 10.2-8.2 12.4-4.8-2.2-8.2-6.2-8.2-12.4 0-6.8 3.4-14 8.2-22.6z"
    opacity=".95"/>
  <path
    fill="url(#mag)"
    d="M64 24c2.6 4.8 4.2 8.8 4.2 12 0 3.4-1.8 5.6-4.2 6.8-2.4-1.2-4.2-3.4-4.2-6.8 0-3.2 1.6-7.2 4.2-12z"
    opacity=".9"/>
  <path fill="#7DF9FF" d="M64 10l2.4 7.2h-4.8L64 10z"/>

  <!-- 侧向电路 -->
  <g stroke="#E07A3A" stroke-width="1.5" stroke-linecap="round" opacity=".75">
    <path d="M46 58 H36"/>
    <path d="M82 58 H92"/>
    <path d="M36 58 V48"/>
    <path d="M92 58 V68"/>
  </g>
  <g fill="#00E5FF">
    <circle cx="36" cy="48" r="1.8"/>
    <circle cx="92" cy="68" r="1.8"/>
    <circle cx="36" cy="58" r="1.5"/>
    <circle cx="92" cy="58" r="1.5"/>
  </g>

  <!-- 底部数据条 -->
  <g stroke="#7DF9FF" stroke-width="1.6" stroke-linecap="round" opacity=".7">
    <path d="M48 120 h6"/>
    <path d="M57 120 h14"/>
    <path d="M74 120 h6"/>
  </g>

</svg>
