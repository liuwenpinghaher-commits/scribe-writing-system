# 默认 profile(:8642 速答/渲染/判官)——scribe3 拥有的键(overlay,深合并进根 config.yaml)。
# 唯一强制项:api_server 零工具面。速答/渲染/判官都是纯补全,不需要任何工具;若继承 Hermes
# 库存 toolsets(含 hermes-cli 终端),主编速答就能执行 git/终端等系统外动作(U-006 真机实证)。
# 这里不含 mcp_servers/platforms——默认网关不挂 scribe3 MCP,端口由 Hermes 自身默认(8642)。
platform_toolsets:
  api_server: []

# P4(hermes 能力审查 2026-07-17):模型兜底链——主模型(阿里云 TokenPlan /
# qwen3.8-max-preview)故障时
# agent loop(conversation_loop 消费 get_fallback_chain)自动切换,三网关同配。
# 两个兜底模型均经真机探针实证可用(同一 ark coding key;kimi 中文长文优先)。
# 这是基础设施韧性(同 DB 重连 S-1,U-011 豁免类),切换在 hermes 侧有日志,非静默降级。
fallback_providers:
  - provider: custom
    model: kimi-k2-thinking
    base_url: https://ark.cn-beijing.volces.com/api/coding/v3
  - provider: custom
    model: MiniMax-M2.5
    base_url: https://ark.cn-beijing.volces.com/api/coding/v3
