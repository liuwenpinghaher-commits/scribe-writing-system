# 写 profile(:8644 Runs/审批写入)——scribe3 拥有的键(overlay)。
# mcp_servers 由 provision 从共享 mcp_servers.yaml 注入。
# 激活动态注册的 read + write MCP 工具面(写作 Runs 既要读设定又要落库)。
#
# 端口 8644:与 canonical 拓扑(settings.py REGISTRY / DEPLOY.md)一致。现网写网关在 172.18.0.1:8644。
platform_toolsets:
  api_server:
    - scribe3_read
    - scribe3_write
# 本地 scribe3.mcp 首次导入 schema 可能超过 Hermes 默认的 1.5 秒发现窗口；
# 过早放弃会让写 Run 无任何 s3_* 工具却仍可完成。10 秒只作用于本 profile。
mcp_discovery_timeout: 10.0
agent:
  # Hermes 官方 auto 只覆盖 gpt/codex/gemini/grok；Qwen 会只描述将调用工具。
  # 写入入口必须实际发起 s3_* MCP 调用，才能产生作者审批，故在此 profile 强制开启。
  tool_use_enforcement: true
  # H1 分档:动稿/Runs——长超时、略保守压缩(保文笔上下文)。
  gateway_timeout: 1800
  gateway_timeout_warning: 900
  clarify_timeout: 900
compression:
  enabled: true
  threshold: 0.55
  protect_last_n: 24
platforms:
  api_server:
    port: 8644
    host: 127.0.0.1


# P4(hermes 能力审查 2026-07-17):模型兜底链——主模型(阿里云 TokenPlan /
# qwen3.8-max-preview)故障时
# agent loop(conversation_loop 消费 get_fallback_chain)自动切换,三网关同配。
# 两个兜底模型均经真机探针实证可用(同一 ark coding key;kimi 中文长文优先)。
# 这是基础设施韧性(同 DB 重连 S-1,U-011 豁免类),切换在 hermes 侧有日志,非静默降级。
fallback_providers:
  - provider: custom
    model: kimi-k2-thinking
    base_url: https://ark.cn-beijing.volces.com/api/coding/v3
  - provider: custom
    model: MiniMax-M2.5
    base_url: https://ark.cn-beijing.volces.com/api/coding/v3
