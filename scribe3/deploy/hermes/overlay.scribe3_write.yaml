# 写 profile(:8644 Runs/审批写入)——scribe3 拥有的键(overlay)。
# mcp_servers 由 provision 从共享 mcp_servers.yaml 注入。
# 激活 read + write 两个工具面(写作 Runs 既要读设定又要落库)。
#
# 端口 8644:与 canonical 拓扑(settings.py REGISTRY / DEPLOY.md)一致。
# ⚠ 现网这台机器的 scribe3_write/config.yaml 端口是 8643(与读 profile 撞)——因为写网关
# 目前没有 launchd 常驻服务、从未真正在 8644 起过,那个 8643 是拷贝残留。provision 会把它
# 校正为 8644(见 provision 的 dry-run 输出)。
platform_toolsets:
  api_server:
    - scribe3_read
    - scribe3_write
platforms:
  api_server:
    port: 8644
    host: 127.0.0.1

# P4(hermes 能力审查 2026-07-17):模型兜底链——主模型(deepseek-v4-pro,coding plan)故障时
# agent loop(conversation_loop 消费 get_fallback_chain)自动切换,三网关同配。
# 两个兜底模型均经真机探针实证可用(同一 ark coding key;kimi 中文长文优先)。
# 这是基础设施韧性(同 DB 重连 S-1,U-011 豁免类),切换在 hermes 侧有日志,非静默降级。
fallback_providers:
  - provider: custom
    model: kimi-k2-thinking
    base_url: https://ark.cn-beijing.volces.com/api/coding/v3
  - provider: custom
    model: MiniMax-M2.5
    base_url: https://ark.cn-beijing.volces.com/api/coding/v3
