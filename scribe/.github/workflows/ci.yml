name: scribe-ci

on:
  push:
    paths: ["scribe/**"]
  pull_request:
    paths: ["scribe/**"]

jobs:
  gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scribe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: pip install fastapi pydantic httpx
      - name: Hard gates (deterministic regression)
        run: python scripts/check_gates.py
      - name: Eval harness (offline self-check)
        run: python eval/run_eval.py
