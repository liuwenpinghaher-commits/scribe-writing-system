[project]
name = "scribe-mcp"
version = "0.0.1"
description = "Scribe 领域 MCP Server —— 人机协同·百万字·写小说系统的数据/工具层(Batch 0)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",          # Hermes 通过 MCP 调用本服务(stdio)
    "sqlite-vec>=0.1.6", # 本地向量检索(替代 pgvector,见 工程8 核实更新)
    "jieba",             # 中文分词(词汇丰富度/重复率指标)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scribe_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
