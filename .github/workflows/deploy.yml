name: deploy-lighthouse

# push main 后由 GitHub 直连服务器同步代码并重建（不经开发者本机网络）
# 服务器访问 github.com 常不稳定：用 Actions checkout + scp，而不是服务器 git pull。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-lighthouse
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI (best-effort)
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            const deadline = Date.now() + 12 * 60 * 1000;
            while (Date.now() < deadline) {
              let runs = [];
              try {
                const { data } = await github.rest.checks.listForRef({ owner, repo, ref: sha, per_page: 100 });
                runs = data.check_runs || [];
              } catch (e) {
                core.warning('checks.listForRef unavailable: ' + e.message);
                return;
              }
              const ci = runs.filter(r => r.name && !String(r.name).toLowerCase().includes('deploy'));
              if (!ci.length) {
                await new Promise(r => setTimeout(r, 15000));
                continue;
              }
              if (ci.some(r => r.status !== 'completed')) {
                await new Promise(r => setTimeout(r, 15000));
                continue;
              }
              const failed = ci.filter(r => r.conclusion && !['success', 'neutral', 'skipped'].includes(r.conclusion));
              if (failed.length) {
                core.setFailed('CI checks failed: ' + failed.map(f => f.name + '=' + f.conclusion).join(', '));
                return;
              }
              core.info('CI checks green');
              return;
            }
            core.warning('Timed out waiting for CI; proceeding with deploy');

      - uses: actions/checkout@v4

      - name: Upload release tree to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: ".,!.git,!**/node_modules,!**/.venv,!**/__pycache__,!scribe3/web/dist,!surrealdb-docs-cache,!docs/external,!oh-story-claudecode-main,!**/*.zip"
          target: /opt/scribe3/app
          overwrite: true
          rm: false

      - name: Rebuild stack on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            export SCRIBE3_REPO_DIR=/opt/scribe3/app
            cd "$SCRIBE3_REPO_DIR"
            test -f deploy/prod/.env
            chmod +x deploy/prod/scripts/*.sh || true
            export SKIP_GIT=1
            bash deploy/prod/scripts/deploy.sh
