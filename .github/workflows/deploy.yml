name: deploy-lighthouse

# push main → GitHub runner 打包精简树 → scp → 服务器解压并 rebuild
# 不经开发者本机；不依赖服务器访问 GitHub。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-lighthouse
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI (best-effort)
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            const deadline = Date.now() + 10 * 60 * 1000;
            while (Date.now() < deadline) {
              let runs = [];
              try {
                const { data } = await github.rest.checks.listForRef({ owner, repo, ref: sha, per_page: 100 });
                runs = data.check_runs || [];
              } catch (e) {
                core.warning('checks.listForRef unavailable: ' + e.message);
                return;
              }
              const ci = runs.filter(r => r.name && !String(r.name).toLowerCase().includes('deploy'));
              if (!ci.length) { await new Promise(r => setTimeout(r, 12000)); continue; }
              if (ci.some(r => r.status !== 'completed')) { await new Promise(r => setTimeout(r, 12000)); continue; }
              const failed = ci.filter(r => r.conclusion && !['success','neutral','skipped'].includes(r.conclusion));
              if (failed.length) {
                core.setFailed('CI failed: ' + failed.map(f => f.name+'='+f.conclusion).join(', '));
                return;
              }
              return;
            }
            core.warning('CI wait timeout; deploying anyway');

      - uses: actions/checkout@v4

      - name: Pack deploy tree
        run: |
          set -euo pipefail
          mkdir -p /tmp/scribe3-pack
          # 只打包运行所需，避免 scp 整仓超时
          rsync -a \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '**/.venv' \
            --exclude '**/__pycache__' \
            --exclude 'scribe3/web/dist' \
            --exclude 'scribe3/web/e2e/.snapshots' \
            --exclude 'surrealdb-docs-cache' \
            --exclude 'docs/external' \
            --exclude 'oh-story-claudecode-main' \
            --exclude 'artifacts' \
            --exclude '.codegraph' \
            --exclude '*.zip' \
            --exclude 'Humanizer-zh-main.zip' \
            ./ /tmp/scribe3-pack/app/
          # 绝不上传服务器密钥
          rm -f /tmp/scribe3-pack/app/deploy/prod/.env
          tar -C /tmp/scribe3-pack -czf /tmp/scribe3-deploy.tgz app
          ls -lh /tmp/scribe3-deploy.tgz

      - name: Upload tarball
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "/tmp/scribe3-deploy.tgz"
          target: /tmp
          overwrite: true

      - name: Extract and rebuild
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            test -f /tmp/scribe3-deploy.tgz
            test -f /opt/scribe3/app/deploy/prod/.env
            # 保留服务器 .env
            cp -a /opt/scribe3/app/deploy/prod/.env /tmp/scribe3.prod.env.bak
            mkdir -p /opt/scribe3
            tar -xzf /tmp/scribe3-deploy.tgz -C /opt/scribe3
            mkdir -p /opt/scribe3/app/deploy/prod
            cp -a /tmp/scribe3.prod.env.bak /opt/scribe3/app/deploy/prod/.env
            chmod 600 /opt/scribe3/app/deploy/prod/.env
            chmod +x /opt/scribe3/app/deploy/prod/scripts/*.sh || true
            export SCRIBE3_REPO_DIR=/opt/scribe3/app
            export SKIP_GIT=1
            bash /opt/scribe3/app/deploy/prod/scripts/deploy.sh
