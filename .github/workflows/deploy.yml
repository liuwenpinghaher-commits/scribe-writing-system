name: deploy-lighthouse

# push main 后由 GitHub 直连服务器 pull+重建，不经开发者本机网络
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-lighthouse
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 等 CI 绿再部署（同 push 的 ci.yml）；workflow_dispatch 直接部署
    steps:
      - name: Wait for CI (optional best-effort)
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            const deadline = Date.now() + 15 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data } = await github.rest.checks.listForRef({ owner, repo, ref: sha });
              const ci = (data.check_runs || []).filter(r => r.name && !String(r.name).includes('deploy'));
              if (ci.length === 0) {
                // checks 可能尚未创建
                await new Promise(r => setTimeout(r, 15000));
                continue;
              }
              const pending = ci.some(r => r.status !== 'completed');
              if (pending) {
                await new Promise(r => setTimeout(r, 15000));
                continue;
              }
              const failed = ci.filter(r => r.conclusion && !['success', 'neutral', 'skipped'].includes(r.conclusion));
              if (failed.length) {
                core.setFailed('CI checks failed: ' + failed.map(f => f.name + '=' + f.conclusion).join(', '));
                return;
              }
              return;
            }
            core.warning('Timed out waiting for CI; proceeding with deploy');

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            export SCRIBE3_REPO_DIR="${SCRIBE3_REPO_DIR:-/opt/scribe3/app}"
            if [ -n "${{ secrets.DEPLOY_REPO_DIR }}" ]; then
              export SCRIBE3_REPO_DIR="${{ secrets.DEPLOY_REPO_DIR }}"
            fi
            export DEPLOY_BRANCH=main
            bash "$SCRIBE3_REPO_DIR/deploy/prod/scripts/deploy.sh"

