name: deploy-lighthouse

# =============================================================================
# 支路 / 可选：GitHub Actions 部署
#
# 主部署不依赖本 workflow。日常请用：
#   ./scripts/deploy_demo.sh          # hot（推荐）
#   ./scripts/deploy_demo.sh server-git
#   ./scripts/deploy_demo.sh full
#
# 设计：
# - 不再 push main 自动触发（避免 Actions 分钟耗尽 / Runner 秒挂时误报「部署失败」）
# - 仅 workflow_dispatch 手动触发；失败不影响主路径与运行中 demo
# - 若 GitHub Actions 不可用，直接忽略本 workflow 即可
# =============================================================================
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "可选备注（主路径仍是 scripts/deploy_demo.sh）"
        required: false
        default: "manual side-path deploy"

concurrency:
  group: deploy-lighthouse
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  deploy:
    name: optional-gha-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 支路失败不拖垮其它检查结论（主部署已与 GHA 解耦）
    continue-on-error: true
    steps:

      - name: Announce side-path
        run: |
          echo "::notice::此 job 为可选支路。主部署：./scripts/deploy_demo.sh"
          echo "reason=${{ github.event.inputs.reason }}"

      - uses: actions/checkout@v4

      - name: Pack deploy tree
        run: |
          set -euo pipefail
          mkdir -p .deploy-artifact
          rsync -a \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '**/.venv' \
            --exclude '**/__pycache__' \
            --exclude 'scribe3/web/dist' \
            --exclude 'scribe3/web/e2e/.snapshots' \
            --exclude 'surrealdb-docs-cache' \
            --exclude 'docs/external' \
            --exclude 'oh-story-claudecode-main' \
            --exclude 'artifacts' \
            --exclude '.codegraph' \
            --exclude '*.zip' \
            --exclude 'Humanizer-zh-main.zip' \
            ./ .deploy-artifact/app/
          rm -f .deploy-artifact/app/deploy/prod/.env
          tar -C .deploy-artifact -czf scribe3-deploy.tgz app
          ls -lh scribe3-deploy.tgz
          sha256sum scribe3-deploy.tgz | tee scribe3-deploy.tgz.sha256

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${DEPLOY_SSH_KEY:-}" ] || missing+=(DEPLOY_SSH_KEY)
          [ -n "${DEPLOY_HOST:-}" ] || missing+=(DEPLOY_HOST)
          [ -n "${DEPLOY_USER:-}" ] || missing+=(DEPLOY_USER)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::支路缺少 secrets: ${missing[*]}。请改用本机 ./scripts/deploy_demo.sh"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | sed 's/\r$//' | sed 's/\\n/\n/g' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "::warning::DEPLOY_SSH_KEY 非法私钥。请改用 ./scripts/deploy_demo.sh"
            exit 1
          fi
          PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -p "$PORT" -T 10 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          printf 'Host deploy-target\n  HostName %s\n  Port %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking accept-new\n  ConnectTimeout 30\n  ServerAliveInterval 15\n  ServerAliveCountMax 8\n' \
            "$DEPLOY_HOST" "$PORT" "$DEPLOY_USER" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Upload tarball (rsync)
        run: |
          set -euo pipefail
          rsync -az --partial --timeout=120 --checksum \
            -e "ssh -F $HOME/.ssh/config" \
            scribe3-deploy.tgz scribe3-deploy.tgz.sha256 \
            deploy-target:/tmp/
          ssh -F "$HOME/.ssh/config" deploy-target \
            'cd /tmp && test -f scribe3-deploy.tgz && sha256sum -c scribe3-deploy.tgz.sha256'

      - name: Extract and rebuild
        run: |
          set -euo pipefail
          ssh -F "$HOME/.ssh/config" deploy-target 'bash -s' <<'REMOTE'
          set -euo pipefail
          test -f /tmp/scribe3-deploy.tgz
          test -f /opt/scribe3/app/deploy/prod/.env
          cp -a /opt/scribe3/app/deploy/prod/.env /tmp/scribe3.prod.env.bak
          mkdir -p /opt/scribe3
          tar -xzf /tmp/scribe3-deploy.tgz -C /opt/scribe3
          mkdir -p /opt/scribe3/app/deploy/prod
          cp -a /tmp/scribe3.prod.env.bak /opt/scribe3/app/deploy/prod/.env
          chmod 600 /opt/scribe3/app/deploy/prod/.env
          chmod +x /opt/scribe3/app/deploy/prod/scripts/*.sh || true
          mkdir -p /opt/scribe3/data/models/hf /opt/scribe3/data/models/fastembed
          export SCRIBE3_REPO_DIR=/opt/scribe3/app
          export SKIP_GIT=1
          bash /opt/scribe3/app/deploy/prod/scripts/deploy.sh
          REMOTE
