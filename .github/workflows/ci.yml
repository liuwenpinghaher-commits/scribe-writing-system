name: ci
on: { push: { branches: [main] }, pull_request: {} }

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      # 单测 conftest 自起临时 memory Surreal(随机端口);GHA service 容器无法传 start 子命令,
      # latest 镜像无默认 CMD 会 unhealthy,导致 job 在 pytest 前失败——只装 CLI 即可。
      - name: Install SurrealDB CLI
        run: |
          set -e
          for i in 1 2 3 4 5; do
            if curl -sSf https://install.surrealdb.com | sh; then
              break
            fi
            echo "SurrealDB install attempt $i failed; retrying..."
            sleep $((i * 5))
            if [ "$i" -eq 5 ]; then exit 1; fi
          done
          echo "$HOME/.surrealdb" >> "$GITHUB_PATH"
          surreal version
      - run: |
          pip install -r scribe3/requirements.txt
          pip install -r scribe3/requirements-dev.txt
      - run: python -m pytest scribe3/tests -q
        env:
          SCRIBE3_SURREAL_URL: ws://127.0.0.1:8001/rpc
          SCRIBE3_SURREAL_USER: root
          SCRIBE3_SURREAL_PASS: root

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: scribe3/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: scribe3/web/package-lock.json }
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - name: Install SurrealDB CLI
        run: |
          set -e
          for i in 1 2 3 4 5; do
            if curl -sSf https://install.surrealdb.com | sh; then
              break
            fi
            echo "SurrealDB install attempt $i failed; retrying..."
            sleep $((i * 5))
            if [ "$i" -eq 5 ]; then exit 1; fi
          done
          echo "$HOME/.surrealdb" >> "$GITHUB_PATH"
          surreal version
      # e2e_ci.sh 用 scribe3/.venv/bin/python 起临时后端——CI 建同路径 venv
      - name: Backend venv for e2e
        run: |
          python -m venv scribe3/.venv
          scribe3/.venv/bin/pip install -r scribe3/requirements.txt
        working-directory: ${{ github.workspace }}
      - run: npx playwright install --with-deps chromium
      - run: ../../scripts/e2e_ci.sh          # L2 前端最后一厘米:独立临时后端,验证链路通+零 console 崩
