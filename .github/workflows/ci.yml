name: ci
on: { push: { branches: [main] }, pull_request: {} }

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      surreal:
        image: surrealdb/surrealdb:latest
        ports: ["8001:8001"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r scribe3/requirements.txt
      - run: pytest scribe3/tests -q
        env:
          SCRIBE3_SURREAL_URL: ws://127.0.0.1:8001/rpc

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: scribe3/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: scribe3/web/package-lock.json }
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - run: curl -sSf https://install.surrealdb.com | sh   # e2e_ci.sh 起独立临时 surreal 需二进制
      - run: npx playwright install --with-deps chromium
      - run: ../../scripts/e2e_ci.sh          # L2 前端最后一厘米:独立临时后端,验证链路通+零 console 崩
