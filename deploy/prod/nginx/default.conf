server {
    listen 80;
    server_name _;
    client_max_body_size 32m;

    root /usr/share/nginx/html;
    index index.html;

    # 专访 1.0（同机 Docker :3210）— 公网安全组通常只开 80，路径反代
    location = /zhuanfang {
        return 302 /zhuanfang/;
    }
    location /zhuanfang/ {
        proxy_pass http://host.docker.internal:3210/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # FastAPI
    location /api/ {
        proxy_pass http://backend:3321/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 兼容未带尾斜杠的 /api
    location = /api {
        return 301 /api/;
    }

    # SSE / 长连接（若有）
    location /api/live {
        proxy_pass http://backend:3321/live;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        proxy_pass http://backend:3321/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

