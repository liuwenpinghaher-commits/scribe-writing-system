server {
    listen 80;
    server_name _;
    client_max_body_size 32m;

    # 静态资源压缩（edge 也会压一层；双层无害，Accept-Encoding 透传时一处生效）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;


    root /usr/share/nginx/html;
    index index.html;

    # 专访 1.0（同机 Docker :3210）— 公网安全组通常只开 80，路径反代
    location = /zhuanfang {
        return 302 /zhuanfang/;
    }
    location /zhuanfang/ {
        proxy_pass http://host.docker.internal:3210/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # FastAPI（含 chat/write、ai/runs SSE）
    # 必须关 proxy_buffering：默认开启会把 event-stream 攒成大块再吐给浏览器，
    # 表现为「聊天一下蹦出一大段」。X-Accel-Buffering:no 由后端 SSE 响应头双保险。
    location /api/ {
        proxy_pass http://backend:3321/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # 避免 gzip 层再次缓冲流式体
        gzip off;
    }

    # 兼容未带尾斜杠的 /api
    location = /api {
        return 301 /api/;
    }

    # SSE / 长连接（live 更长超时；其余 SSE 已由 /api/ 统一关缓冲）
    location /api/live {
        proxy_pass http://backend:3321/live;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 带 hash 的静态资源：缺失必须 404，禁止回退 index.html
    # （否则浏览器会把 HTML 当 JS 解析 → Failed to fetch dynamically imported module）
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 入口 HTML：禁止长缓存，确保发版后浏览器拉到新 chunk 清单
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # SPA 路由（仅非资产路径回退 index）
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        proxy_pass http://backend:3321/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

