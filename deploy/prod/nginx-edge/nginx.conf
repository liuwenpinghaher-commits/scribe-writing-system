user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # HTTP → HTTPS (+ ACME)
    server {
        listen 80;
        server_name tonglu.qing.blue qing.blue www.qing.blue zhuanfang.qing.blue;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS 铜炉主域（scribe / tonglu）
    server {
        listen 443 ssl;
        server_name tonglu.qing.blue;

        ssl_certificate /etc/nginx/ssl/tonglu.qing.blue_fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/tonglu.qing.blue.key;

        ssl_session_timeout 5m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
        ssl_prefer_server_ciphers on;

        location /api/ {
            proxy_pass http://prod-frontend-1:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            gzip off;
        }

        location = /zhuanfang {
            return 301 https://zhuanfang.qing.blue/;
        }
        location /zhuanfang/ {
            rewrite ^/zhuanfang/?(.*)$ https://zhuanfang.qing.blue/$1 permanent;
        }

        location / {
            proxy_pass http://prod-frontend-1:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }

    # 旧主域 → 铜炉主域
    server {
        listen 443 ssl;
        server_name qing.blue www.qing.blue;

        ssl_certificate /etc/nginx/ssl/qing.blue_bundle.crt;
        ssl_certificate_key /etc/nginx/ssl/qing.blue.key;

        ssl_session_timeout 5m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
        ssl_prefer_server_ciphers on;

        location / {
            return 301 https://tonglu.qing.blue$request_uri;
        }
    }

    # HTTPS 专访子域
    server {
        listen 443 ssl;
        server_name zhuanfang.qing.blue;

        ssl_certificate /etc/nginx/ssl/zhuanfang.qing.blue_fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/zhuanfang.qing.blue.key;

        ssl_session_timeout 5m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
        ssl_prefer_server_ciphers on;

        client_max_body_size 64m;

        location / {
            proxy_pass http://zhuanfang:3210;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
        }
    }
}
