# scribe3 生产栈（腾讯云轻量 / 任意 Linux）
# 用法（在仓库根）:
#   docker compose -f deploy/prod/docker-compose.yml --env-file deploy/prod/.env up -d --build
#
# Hermes 网关跑在宿主机（systemd）：default/scribe3/write + plan/draft/deduce*。
# backend 经 Docker 网桥网关（常 172.18.0.1）访问 8642–8648；勿用 127.0.0.1。
# 对外只暴露 80（nginx 同源 / 与 /api）。

services:
  surreal:
    image: surrealdb/surrealdb:v3.2.4
    user: root
    restart: unless-stopped
    # SurrealDB 3.2.4（勿用 2.x 镜像挂本数据目录；勿改 latest）
    # 3.2 CLI 已支持 query/transaction timeout（2.1.4 无）。
    # 迁移/多语句脚本可能较长：默认 300s/120s，可用 env 覆盖。
    command: >
      start
      --user ${SURREAL_USER:-root}
      --pass ${SURREAL_PASS:-root}
      --bind 0.0.0.0:8000
      --log info
      --query-timeout ${SURREAL_QUERY_TIMEOUT:-300s}
      --transaction-timeout ${SURREAL_TRANSACTION_TIMEOUT:-120s}
      surrealkv:/data/data.db
    volumes:
      - ${SCRIBE3_DATA_DIR:-/opt/scribe3/data}/surreal:/data
    # 仅本机/容器网可连；不映射公网，防裸奔 DB
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://127.0.0.1:8000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ../..
      dockerfile: scribe3/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SCRIBE3_SURREAL_URL: ws://surreal:8000/rpc
      SCRIBE3_SURREAL_USER: ${SURREAL_USER:-root}
      SCRIBE3_SURREAL_PASS: ${SURREAL_PASS:-root}
      # Docker Desktop / Linux host 网关：访问宿主机 Hermes（含阶段硬 profile）
      HERMES_API: ${HERMES_API:-http://172.18.0.1:8642/v1}
      HERMES_RESPONSES_API: ${HERMES_RESPONSES_API:-http://172.18.0.1:8643/v1}
      HERMES_RUNS_API: ${HERMES_RUNS_API:-http://172.18.0.1:8644/v1}
      HERMES_DEDUCE_RUNS_API: ${HERMES_DEDUCE_RUNS_API:-http://172.18.0.1:8645/v1}
      HERMES_DEDUCE_PREVIEW_RUNS_API: ${HERMES_DEDUCE_PREVIEW_RUNS_API:-http://172.18.0.1:8646/v1}
      HERMES_PLAN_RUNS_API: ${HERMES_PLAN_RUNS_API:-http://172.18.0.1:8647/v1}
      HERMES_DRAFT_RUNS_API: ${HERMES_DRAFT_RUNS_API:-http://172.18.0.1:8648/v1}
      HERMES_RESPONSES_PROFILE: ${HERMES_RESPONSES_PROFILE:-scribe3}
      HERMES_RUNS_PROFILE: ${HERMES_RUNS_PROFILE:-scribe3_write}
      SCRIBE3_CORS_ORIGINS: ${SCRIBE3_CORS_ORIGINS:-http://203.0.113.10,http://127.0.0.1}
      SCRIBE3_SETTINGS_DB: /var/lib/scribe3/scribe3_settings.sqlite3
      SCRIBE3_LLM_LEDGER: /var/lib/scribe3/scribe3_llm_ledger.sqlite3
      # 生产不强制因网关未 provision 就拒启；装完 Hermes 后再开 STRICT
      SCRIBE3_STRICT_GATEWAY_GUARD: ${SCRIBE3_STRICT_GATEWAY_GUARD:-0}
      # 读宿主 Hermes profile 配置（MCP 工具面 / skill 诊断）；网关进程仍在宿主机
      HERMES_HOME: ${HERMES_HOME_IN_CONTAINER:-/hermes-host}
      # embedding：容器无公网时读挂载缓存；镜像默认走 hf-mirror（见 embed.py）
      HF_HOME: /models/hf
      FASTEMBED_CACHE_PATH: /models/fastembed
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_ENABLE_HF_TRANSFER: "0"
    volumes:
      - ${SCRIBE3_DATA_DIR:-/opt/scribe3/data}/settings:/var/lib/scribe3
      - ${SCRIBE3_DATA_DIR:-/opt/scribe3/data}/models/hf:/models/hf
      - ${SCRIBE3_DATA_DIR:-/opt/scribe3/data}/models/fastembed:/models/fastembed
      # 只读挂载宿主 ~/.hermes，供 /ai/runtime-status 扫 profile 配置（勿写）
      - ${HERMES_HOME_HOST:-/opt/scribe3-host/.hermes}:/hermes-host:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      surreal:
        condition: service_healthy
    expose:
      - "3321"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3321/ready', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: ../../scribe3/web
      dockerfile: Dockerfile
      args:
        # 同源 /api，由 nginx 反代到 backend（见 api.js 注释：避免跨端口 POST 被拦）
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # 外层若已有 nginx-ssl 占用 80/443，勿再绑 0.0.0.0:80（会 Created 起不来）。
    # 只绑回环端口做本机探活；公网由 nginx-ssl 反代容器名 prod-frontend-1:80。
    expose:
      - "80"
    ports:
      - "127.0.0.1:${SCRIBE3_HTTP_PORT:-8088}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

