<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>左栏能力与手稿目录 Demo</title>
  <style>
    :root {
      --canvas: #f6f4ee;
      --surface: #fffdf8;
      --surface-2: #f0ede5;
      --line: #ddd6ca;
      --ink: #2d2a25;
      --muted: #756f65;
      --faint: #9a9388;
      --brand: #2f7563;
      --brand-soft: #dcebe5;
      --accent: #8a5c19;
      --danger: #a34040;
      --blue: #386a9f;
      --shadow: rgba(38, 32, 24, .12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #e8e3d8;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button, input {
      font: inherit;
      letter-spacing: 0;
    }

    .page {
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
    }

    .demo {
      width: min(1440px, 100%);
      height: min(900px, calc(100vh - 48px));
      min-height: 720px;
      border: 1px solid var(--line);
      background: var(--canvas);
      box-shadow: 0 20px 52px var(--shadow);
      overflow: hidden;
      display: grid;
      grid-template-rows: 48px 1fr;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      min-width: 0;
    }

    .brand {
      color: var(--brand);
      font-weight: 760;
      font-size: 15px;
      min-width: 72px;
    }

    .book {
      height: 30px;
      max-width: 170px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 10px;
      border: 1px solid var(--line);
      background: #fbfaf6;
      color: var(--muted);
      border-radius: 7px;
      font-size: 13px;
    }

    .views, .phase {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    .views {
      padding-left: 12px;
      border-left: 1px solid var(--line);
    }

    .phase {
      margin-left: auto;
      max-width: 54%;
      overflow-x: auto;
      scrollbar-width: none;
      background: var(--surface-2);
      padding: 3px;
      border-radius: 8px;
    }

    .phase::-webkit-scrollbar { display: none; }

    .topbtn {
      height: 30px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      padding: 0 9px;
      font-size: 13px;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .topbtn.active {
      background: var(--surface);
      color: var(--brand);
      font-weight: 680;
      box-shadow: inset 0 0 0 1px var(--line);
    }

    .shell {
      min-height: 0;
      display: grid;
      grid-template-columns: 124px 320px minmax(460px, 1fr) 300px;
    }

    .rail,
    .directory,
    .right {
      min-height: 0;
      background: var(--surface);
    }

    .rail {
      border-right: 1px solid var(--line);
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .rail-scroll {
      overflow-y: auto;
      padding: 10px 8px 14px;
    }

    .group-label {
      margin: 12px 8px 6px;
      color: var(--faint);
      font-size: 10px;
      font-weight: 720;
      text-transform: uppercase;
    }

    .rail-btn {
      width: 100%;
      height: 36px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 9px;
      margin-bottom: 4px;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
    }

    .rail-btn:hover { background: var(--surface-2); color: var(--ink); }

    .rail-btn.active {
      background: var(--brand-soft);
      color: var(--brand);
      font-weight: 720;
    }

    .rail-ico {
      width: 18px;
      height: 18px;
      display: inline-grid;
      place-items: center;
      border-radius: 5px;
      background: rgba(47, 117, 99, .08);
      font-size: 11px;
      flex: 0 0 auto;
    }

    .directory {
      border-right: 1px solid var(--line);
      display: grid;
      grid-template-rows: auto 1fr;
      min-width: 0;
    }

    .dir-head {
      border-bottom: 1px solid var(--line);
      background: rgba(255, 253, 248, .96);
      padding: 12px;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .dir-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .dir-title {
      font-size: 15px;
      font-weight: 760;
      min-width: 0;
      flex: 1;
    }

    .badge {
      min-width: 0;
      height: 22px;
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 0 8px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .badge.green { background: var(--brand-soft); color: var(--brand); }
    .badge.warn { background: #f4e4c9; color: var(--accent); }
    .badge.red { background: #f2dada; color: var(--danger); }
    .badge.blue { background: #dbe7f2; color: var(--blue); }

    .current {
      border: 1px solid var(--line);
      background: #fbfaf6;
      border-radius: 8px;
      padding: 9px;
      margin-bottom: 9px;
    }

    .current-main {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 680;
    }

    .current-sub {
      margin-top: 3px;
      color: var(--faint);
      font-size: 11px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 6px;
      margin-bottom: 8px;
    }

    .input {
      min-width: 0;
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface);
      padding: 0 9px;
      color: var(--ink);
      font-size: 12px;
    }

    .small-btn {
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface);
      color: var(--muted);
      padding: 0 9px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .small-btn.primary {
      background: var(--brand);
      border-color: var(--brand);
      color: white;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .chip {
      height: 24px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      padding: 0 8px;
      font-size: 11px;
      cursor: pointer;
    }

    .chip.active {
      background: var(--brand-soft);
      color: var(--brand);
      border-color: transparent;
      font-weight: 680;
    }

    .dir-body {
      overflow-y: auto;
      min-height: 0;
      padding: 10px 10px 18px;
    }

    .section-title {
      color: var(--faint);
      font-size: 10px;
      font-weight: 760;
      text-transform: uppercase;
      margin: 12px 2px 6px;
    }

    .tree-row {
      min-height: 34px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      width: 100%;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 7px;
      padding: 6px 8px;
      margin: 2px 0;
      text-align: left;
      cursor: pointer;
      font-size: 13px;
    }

    .tree-row:hover { background: var(--surface-2); color: var(--ink); }

    .tree-row.active {
      background: var(--brand-soft);
      color: var(--brand);
      font-weight: 700;
    }

    .indent-1 { padding-left: 22px; }
    .indent-2 { padding-left: 42px; }

    .arrow {
      color: var(--faint);
      width: 12px;
      text-align: center;
    }

    .count {
      color: var(--faint);
      font-size: 11px;
    }

    .detail {
      min-width: 0;
      min-height: 0;
      background: var(--canvas);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .detail-head {
      min-height: 76px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 253, 248, .82);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 22px;
    }

    .crumb {
      color: var(--faint);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .detail-title {
      font-size: 20px;
      font-weight: 780;
      color: var(--ink);
      line-height: 1.2;
    }

    .detail-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .detail-body {
      min-height: 0;
      overflow: auto;
      padding: 22px;
    }

    .workspace {
      display: grid;
      gap: 16px;
      max-width: 960px;
    }

    .band {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 8px;
      padding: 16px;
    }

    .band-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 760;
      margin-bottom: 10px;
    }

    .body-text {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .metric-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(221, 214, 202, .72);
      color: var(--muted);
      font-size: 13px;
    }

    .metric-row:last-child { border-bottom: 0; }

    .quote {
      border-left: 3px solid var(--brand);
      padding-left: 12px;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.8;
      background: linear-gradient(90deg, rgba(47, 117, 99, .08), transparent);
    }

    .right {
      border-left: 1px solid var(--line);
      display: grid;
      grid-template-rows: auto 1fr;
      min-width: 0;
    }

    .right-tabs {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 2px;
      padding: 8px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .right-tabs button {
      height: 30px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
    }

    .right-tabs button.active {
      background: var(--surface-2);
      color: var(--ink);
      font-weight: 700;
    }

    .right-body {
      padding: 14px;
      overflow: auto;
      min-height: 0;
    }

    .chief-box {
      border: 1px solid var(--line);
      background: #fbfaf6;
      border-radius: 8px;
      padding: 13px;
      margin-bottom: 12px;
    }

    .chief-title {
      font-size: 13px;
      font-weight: 760;
      margin-bottom: 6px;
    }

    .chief-text {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .hint {
      color: var(--faint);
      font-size: 11px;
      line-height: 1.6;
    }

    @media (max-width: 1180px) {
      .shell { grid-template-columns: 110px 286px minmax(420px, 1fr); }
      .right { display: none; }
      .phase { max-width: 45%; }
    }

    @media (max-width: 900px) {
      .page { padding: 10px; }
      .demo { height: calc(100vh - 20px); min-height: 680px; }
      .shell { grid-template-columns: 96px minmax(230px, 36%) 1fr; }
      .book { display: none; }
      .views .topbtn span { display: none; }
      .phase { display: none; }
      .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>

        </aside>

    </section>
  </main>

    function renderRail() {
      const rail = document.getElementById('rail');
      rail.innerHTML = railGroups.map(group => `
        <div class="group-label">${group.label}</div>
        ${group.items.map(item => `
          <button class="rail-btn ${state.activeRail === item.key ? 'active' : ''}" data-rail="${item.key}">
            <span class="rail-ico">${item.icon}</span>
            <span>${item.label}</span>
          </button>
        `).join('')}
      `).join('');

      rail.querySelectorAll('[data-rail]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.activeRail = btn.dataset.rail;
          state.activeItem = defaultItem(btn.dataset.rail);
          render();
        });
      });
    }

    function defaultItem(key) {
      const first = data[key].sections[0].rows[0];
      if (key === 'manuscript') return 'ch23';
      return first[0];
    }

    function renderDirectory() {
      const cfg = data[state.activeRail];
      const [main, sub] = cfg.current;
      document.getElementById('dirHead').innerHTML = `
        <div class="dir-title-row">
          <div class="dir-title">${cfg.title}</div>
          <span class="badge green">${cfg.badge}</span>
        </div>
        <div class="current">
          <div class="current-main"><span>${main}</span><span>固定</span></div>
          <div class="current-sub">${sub}</div>
        </div>
        <div class="controls">
          <input class="input" value="${state.activeRail === 'search' ? '炼丹复活' : ''}" placeholder="${state.activeRail === 'search' ? '按意思搜' : '跳章 / 过滤'}" />
          <button class="small-btn">${state.activeRail === 'manuscript' ? '上一章' : '范围'}</button>
          <button class="small-btn primary">${state.activeRail === 'search' ? '搜索' : '同步'}</button>
        </div>
        <div class="chips">
          ${cfg.chips.map((chip, index) => `<button class="chip ${index === 0 ? 'active' : ''}">${chip}</button>`).join('')}
        </div>
      `;

      document.getElementById('dirBody').innerHTML = cfg.sections.map(section => `
        <div class="section-title">${section.title}</div>
        ${section.rows.map(row => {
          const [id, label, icon, count, indent = 0] = row;
          return `
            <button class="tree-row indent-${indent} ${state.activeItem === id ? 'active' : ''}" data-item="${id}">
              <span class="arrow">${icon}</span>
              <span>${label}</span>
              <span class="count">${count || ''}</span>
            </button>
          `;
        }).join('')}
      `).join('');

      document.getElementById('dirBody').querySelectorAll('[data-item]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.activeItem = btn.dataset.item;
          renderDirectory();
          renderDetail();
        });
      });
    }

    function renderDetail() {
      const copy = detailCopy[state.activeRail];
      const cfg = data[state.activeRail];
      document.getElementById('detailHead').innerHTML = `
        <div>

          <div class="detail-title">${copy.title}</div>
        </div>
        <div class="detail-actions">

          <span class="badge warn">栏3详情</span>

          </div>
        </div>
      `;

      document.getElementById('chiefContext').textContent = `${cfg.title} · ${copy.title}`;
    }

    function render() {
      renderRail();
      renderDirectory();
      renderDetail();
    }
